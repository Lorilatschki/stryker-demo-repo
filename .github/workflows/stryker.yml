name: Mutation Testing

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  stryker:
    name: Stryker Mutation Testing
    runs-on: ubuntu-latest

    container:
      image: mcr.microsoft.com/dotnet/sdk:10.0

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install dotnet-stryker
        run: |
          dotnet tool install -g dotnet-stryker --version 5.0.0
          echo "$HOME/.dotnet/tools" >> "$GITHUB_PATH"

      - name: Restore
        run: dotnet restore src/Queue.csproj

      - name: Run Stryker
        run: |
          dotnet-stryker \
            --output .stryker \
            --project src/Queue.csproj \
            --test-project test/Queue.Test/Queue.Test.csproj \
            --test-project test/Stack.Test/Stack.Test.csproj \
            --test-runner mtp \
            --diag \
            --mutation-level Advanced

      - name: Upload Stryker report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stryker-report
          path: .stryker/